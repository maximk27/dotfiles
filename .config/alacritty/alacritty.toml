[keyboard]
bindings = [
    # { key= "Back", mods= "Alt", chars= "\u0017" }
  { key="Key0",   mods="Control", action="ResetFontSize" },
]

[selection]
save_to_clipboard = true

[env]
TERM = "xterm-256color"

[colors.cursor]
text = "#282a36"
# cursor = "#A0A0A0"
cursor = "#000000"

[colors.vi_mode_cursor]

text = "CellBackground"
cursor = "CellForeground"


[window]
opacity = 0.99
padding.x = 10
padding.y = 10
startup_mode = "Maximized"
decorations = "None"

[font]
offset.x = 0
offset.y = 1
normal.family = "JetBrainsMono Nerd Font"
size = 12

glyph_offset.x = 0
glyph_offset.y = 0

