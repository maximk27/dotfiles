[keyboard]
bindings = [
  { key= "Back", mods= "Control", chars= "\u0017" },
  { key="Key0",   mods="Control", action="ResetFontSize" },
]

[selection]
save_to_clipboard = true

[env]
TERM = "alacritty"

[cursor.style]
shape = "Beam"

[cursor.vi_mode_style]
shape = "Block"

[colors.cursor]
text = "#282a36"
# cursor = "#A0A0A0"
cursor = "#000000"

[window]
opacity = 0.99
padding.x = 5
padding.y = 0
startup_mode = "Maximized"
decorations = "None"

[font]
offset.x = 0
offset.y = 1
normal.family = "JetBrainsMono Nerd Font"
size = 12

glyph_offset.x = 0
glyph_offset.y = 0

# Colors (Solarized Light)
# Default colors
[colors.primary]
background = '#fdf6e3'
foreground = '#586e75'

# Normal colors
[colors.normal]
black   = '#073642'
red     = '#dc322f'
green   = '#859900'
yellow  = '#b58900'
blue    = '#268bd2'
magenta = '#d33682'
cyan    = '#2aa198'
white   = '#eee8d5'

# Bright colors
[colors.bright]
black   = '#002b36'
red     = '#cb4b16'
green   = '#586e75'
yellow  = '#657b83'
blue    = '#839496'
magenta = '#6c71c4'
cyan    = '#93a1a1'
white   = '#fdf6e3'
