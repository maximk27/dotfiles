# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# cpu bar
set -g @plugin 'tmux-plugins/tmux-cpu'

# persistency
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# copy
set -g @plugin 'laktak/extrakto'

# copy
set -g @extrakto_popup_size "50%"
set -g @extrakto_clip_tool "xsel --input --clipboard" # works better for nvim
set -g @extrakto_copy_key "tab"      # use tab to copy to clipboard
set -g @extrakto_insert_key "enter"  # use enter to insert selection
set -g @extrakto_fzf_unset_default_opts "false"  # keep our custom FZF_DEFAULT_OPTS
set -g @extrakto_fzf_header "i c f g" # for small screens shorten the fzf header
#
# Use Ctrl+a as prefix instead of default Ctrl+b (easier on the fingers)
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Reload config
bind r source-file ~/.tmux.conf

# kill pane without confirmation
bind x kill-pane

set-option -g focus-events on

set -s extended-keys on
set -as terminal-features 'alacritty:extkeys'

# Vim copy mode
bind w copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi M-k send-keys -X -N 5 cursor-up
bind-key -T copy-mode-vi M-j send-keys -X -N 5 cursor-down
bind-key -T copy-mode-vi Up send-keys -X -N 5 cursor-up
bind-key -T copy-mode-vi Down send-keys -X -N 5 cursor-down
# like vim's 10<C-y> / 10<C-e>: move the view, not the cursor
bind-key -T copy-mode-vi C-u send-keys -X -N 10 scroll-up
bind-key -T copy-mode-vi C-d send-keys -X -N 10 scroll-down

# block cursor in copy mode, back to whatever the app sets otherwise
set-hook -g pane-mode-changed 'set -pF cursor-style "#{?pane_in_mode,block,default}"'

# Enable mouse support
set -g mouse on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# truecolor when nested inside another tmux (e.g. the remote under the local one)
set -as terminal-features 'tmux-256color:RGB'

# user-space tools from deps.sh --install. Popups and new panes get the server's
# environment, which may predate remote.sh adding these to PATH.
run-shell 'for d in "$HOME/.local/nvim/bin" "$HOME/.local/bin"; do case ":$PATH:" in *":$d:"*) ;; *) [ -d "$d" ] && PATH="$d:$PATH" ;; esac; done; tmux set-environment -g PATH "$PATH"'

set -g history-limit 10000

# Enable vi-style keys in copy mode
setw -g mode-keys vi


# session chooser 
# https://www.reddit.com/r/tmux/comments/fsuy7e/start_session_index_from_1_instead_of_0/
unbind s
bind space display-popup -E -w 80% -h 80% "~/.tmux/scripts/pick-session.sh"

# Easier split shortcuts
unbind s
unbind S
bind s split-window -c "#{pane_current_path}"
bind S split-window -p 25 -c "#{pane_current_path}"

unbind v
unbind V
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -h -p 30 -c "#{pane_current_path}"

# numbering
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6

bind -n F12 new-window -a -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap current pane with its neighbour; focus follows the moved pane (resize with mouse)
bind H   swap-pane -d -t "{left-of}"
bind L   swap-pane -d -t "{right-of}"
bind K   swap-pane -d -t "{up-of}"
bind J   swap-pane -d -t "{down-of}"

# zoom/unzoom the current pane
bind o resize-pane -Z

# Set window title
set -g set-titles on
set -g set-titles-string '#T'

# Make status bar look clean (colours are in the theme below; status-bg/fg would override status-style)
set -g status-left '[#S]'
set -g status-right '%Y-%m-%d %H:%M'

# Start with 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Fast pane switching
setw -g aggressive-resize on

# status bar config
set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-keys vi
# set -g status-position bottom
set -g status-position top

# dark
# set -g status-style "fg=colour136,bg=colour235"
# set -g window-status-style "fg=colour244,bg=default"
# set -g window-status-current-style "fg=orange,bg=default"
# set -g status-left "#{?client_prefix,#[bg=orange]#[fg=colour235],#[bg=default]#[fg=orange]} #(whoami) "


# light
# @accent + status-style: orange on the tmux the prefix goes to, blue on the other (see C-] below)
set -g @accent "#cb4b16"
set -g status-style "fg=#586e75,bg=#fbe5d6"
set -g window-status-style "fg=#657b83,bg=default"
set -g window-status-current-style "bg=default,bold"
set -g status-left "#{?client_prefix,#[bg=#{@accent}]#[fg=#fdf6e3],#[bg=default]#[fg=#{@accent}]} #(whoami) "

# over ssh: bar at the bottom so the two don't stack, and show the host
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g status-position bottom
  set -g status-left "#{?client_prefix,#[bg=#{@accent}]#[fg=#fdf6e3],#[bg=default]#[fg=#{@accent}]} #(whoami)@#h "
}

# a client attaching from inside another tmux starts inactive, since the outer one has the prefix
set-hook -g client-attached {
  if -F '#{m/r:^(tmux|screen),#{client_termname}}' {
    set -g @accent "#268bd2"
    set -g status-style "fg=#586e75,bg=#dfeaf3"
  } {
    set -g @accent "#cb4b16"
    set -g status-style "fg=#586e75,bg=#fbe5d6"
  }
  refresh-client -S
}


set -g status-left-length 40
set -g status-left-style default

set -g status-right-length 140

set -g window-status-format "  #I:#W  "
set -g window-status-current-format "#[fg=#{@accent}][ #I:#W ]"


set -g status-right '#{cpu_percentage}'

# C-] toggles this tmux off so every key (prefix included) goes to a nested tmux.
# If the pane is running ssh, it also sends an escape sequence that the nested tmux
# reads as User0/User1 to turn itself orange/blue, so the orange bar is always the
# one the prefix goes to.
set -s user-keys[0] "\e[9990~"
set -s user-keys[1] "\e[9991~"
bind -T root User0 set -g @accent "#cb4b16" \; set -g status-style "fg=#586e75,bg=#fbe5d6" \; refresh-client -S
bind -T root User1 set -g @accent "#268bd2" \; set -g status-style "fg=#586e75,bg=#dfeaf3" \; refresh-client -S
bind -T root C-] \
  set prefix None \;\
  set key-table off \;\
  set @accent "#268bd2" \;\
  set status-style "fg=#586e75,bg=#dfeaf3" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  if -F '#{==:#{pane_current_command},ssh}' 'send-keys -H 1b 5b 39 39 39 30 7e' \;\
  refresh-client -S
bind -T off C-] \
  set -u prefix \;\
  set -u key-table \;\
  set -u @accent \;\
  set -u status-style \;\
  if -F '#{==:#{pane_current_command},ssh}' 'send-keys -H 1b 5b 39 39 39 31 7e' \;\
  refresh-client -S
set -ga status-right "#{?#{==:#{client_key_table},off},#[bold] OFF ,}"


# come back
set -g detach-on-destroy off

# sessions
set -g @continuum-restore 'on' 
set -g @continuum-save-interval '5'

# autosave only config, cpp, the most recent other session, and sessions pinned
# with a manual prefix+C-s (prefix+M-s unpins). $SCRIPT_OUTPUT is "quiet" for autosaves.
set -g @resurrect-hook-post-save-layout '~/.tmux/scripts/filter-save.sh "$SCRIPT_OUTPUT"'
bind M-s run-shell '~/.tmux/scripts/unpin.sh'

# always keep config and cpp sessions around (delay lets continuum restore first)
set -g @resurrect-hook-post-restore-all '~/.tmux/scripts/ensure-sessions.sh'
set-hook -g session-closed 'run-shell -b "~/.tmux/scripts/ensure-sessions.sh"'
run-shell -b 'sleep 5 && ~/.tmux/scripts/ensure-sessions.sh'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
