# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# cpu bar
set -g @plugin 'tmux-plugins/tmux-cpu'

# persistency
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# copy
set -g @plugin 'laktak/extrakto'

# copy
set -g @extrakto_popup_size "50%"
set -g @extrakto_clip_tool "xsel --input --clipboard" # works better for nvim
set -g @extrakto_copy_key "tab"      # use tab to copy to clipboard
set -g @extrakto_insert_key "enter"  # use enter to insert selection
set -g @extrakto_fzf_unset_default_opts "false"  # keep our custom FZF_DEFAULT_OPTS
set -g @extrakto_fzf_header "i c f g" # for small screens shorten the fzf header
#
# Use Ctrl+a as prefix instead of default Ctrl+b (easier on the fingers)
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Reload config
bind r source-file ~/.tmux.conf 

set-option -g focus-events on

# Vim copy mode
bind w copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi M-k send-keys -X -N 5 cursor-up
bind-key -T copy-mode-vi M-j send-keys -X -N 5 cursor-down

# Enable mouse support
set -g mouse on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 10000

# Enable vi-style keys in copy mode
setw -g mode-keys vi


# session chooser 
# https://www.reddit.com/r/tmux/comments/fsuy7e/start_session_index_from_1_instead_of_0/
unbind s
bind space choose-tree -s -Z -K "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}"

# Easier split shortcuts
unbind s
unbind S
bind s split-window -c "#{pane_current_path}"
bind S split-window -p 25 -c "#{pane_current_path}"

unbind v
unbind V
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -h -p 30 -c "#{pane_current_path}"

# numbering
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-t new-window -a -c "#{pane_current_path}"
bind -n M-w kill-pane

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+Arrow
bind H   resize-pane -L 7
bind L   resize-pane -R 7
bind K   resize-pane -U 7
bind J   resize-pane -D 7

# Set window title
set -g set-titles on
set -g set-titles-string '#T'

# Make status bar look clean
set -g status-bg black
set -g status-fg white
set -g status-left '[#S]'
set -g status-right '%Y-%m-%d %H:%M'

# Start with 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Fast pane switching
setw -g aggressive-resize on

# status bar config
set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-keys vi
# set -g status-position bottom
set -g status-position top

# dark
# set -g status-style "fg=colour136,bg=colour235"
# set -g window-status-style "fg=colour244,bg=default"
# set -g window-status-current-style "fg=orange,bg=default"
# set -g status-left "#{?client_prefix,#[bg=orange]#[fg=colour235],#[bg=default]#[fg=orange]} #(whoami) "


# light
# Status bar background
set -g status-style "fg=yellow,bg=default"
set -g window-status-style "fg=brightyellow,bg=default"
set -g window-status-current-style "fg=yellow,bg=default,bold"
set -g status-left "#{?client_prefix,#[bg=yellow]#[fg=white],#[bg=default]#[fg=yellow]} #(whoami) "


set -g status-left-length 20
set -g status-left-style default

set -g status-right-length 140

set -g window-status-format "  #I:#W  "
set -g window-status-current-format "[ #I:#W ]"


set -g status-right '#{cpu_percentage}'


# come back
set -g detach-on-destroy off

# sessions
set -g @continuum-restore 'on' 
set -g @continuum-save-interval '5'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
